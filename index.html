<!DOCTYPE html><html lang="my"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Love You 💗</title><style>*{box-sizing:border-box}body{ margin:0;min-height:100vh;display:flex;align-items:center; justify-content:center;overflow:hidden; font-family:Arial,sans-serif;text-align:center; background:#fffafa;color:#333;}#hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none}.heart{position:absolute;bottom:-30px;animation:float 6s linear forwards}@keyframes float{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}.card{ width:90%;max-width:360px;padding:20px; background:white;border-radius:20px; box-shadow:0 5px 25px #f5b6cc55;position:relative;}.picture{font-size:100px;height:150px;display:grid;place-items:center}#message{font-size:20px;line-height:1.7;min-height:65px}button{ width:100%;border:0;border-radius:8px;padding:13px; font-size:18px;font-weight:bold;color:white;margin:6px 0; cursor:pointer;}#yes{background:#22bf65}#no{background:#ed4d20}#reply{display:none;color:#ed5890;font-size:22px;font-weight:bold}</style></head><body><div id="hearts"></div><div class="card"> <div class="picture" id="picture">🥺💗</div> <div id="message">ပြန်ကြိုက်ပါလား💔</div> <div id="buttons">  <button id="yes">ချစ်တယ် ❤️</button>  <button id="no">မချစ်ဘူး 💔</button> </div> <div id="reply">ကိုကိုလဲချစ်ပါတယ်ကွာ😘</div></div><script>const steps=[ ["ပြန်ကြိုက်ပါလား💔","🥺💗"], ["ချစ်ပါ🥺","🐻💗"], ["ချစ်ရင်မုန့်တွေကျွေးမှာ🫣","🐻🍰"], ["လူကိုလဲစားရမှာနော်🤭","😳💗"], ["ချစ်လေနော်🥺💔","🥺💔"], ["မငြင်းပါနဲ့😭","😭💗"], ["ငိုတော့မယ်😭","😭💧"], ["Just Say Yes🥺","🥺💖"]];let step=0;const message=document.getElementById("message");const picture=document.getElementById("picture");const no=document.getElementById("no");const yes=document.getElementById("yes");const buttons=document.getElementById("buttons");const reply=document.getElementById("reply");no.onclick=function(){ if(step<steps.length-1){  step++;  message.textContent=steps[step][0];  picture.textContent=steps[step][1]; }else{  no.style.display="none"; }};yes.onclick=function(){ message.style.display="none"; buttons.style.display="none"; picture.textContent="🥰💋"; reply.style.display="block"; for(let i=0;i<30;i++){  setTimeout(makeHeart,i*100); }};function makeHeart(){ const h=document.createElement("span"); h.className="heart"; h.textContent=["💗","💕","💖","💘","❤️"][Math.floor(Math.random()*5)]; h.style.left=Math.random()*100+"vw"; h.style.fontSize=(18+Math.random()*20)+"px"; h.style.animationDuration=(3+Math.random()*4)+"s"; document.getElementById("hearts").appendChild(h); setTimeout(()=>h.remove(),8000);}setInterval(makeHeart,500);</script></body></html>
